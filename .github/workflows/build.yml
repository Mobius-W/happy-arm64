name: build-happy-arm64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REF: cli-1.2.5
  UPSTREAM_SHA: 4beb3543cfdeb507be838016996f7a0f65cf7b49
  IMAGE: ghcr.io/mobius-w/happy-arm64

jobs:
  build:
    # Native arm64 public runner; no QEMU, so the pnpm native builds are fast.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Checkout upstream at pinned tag
        uses: actions/checkout@v4
        with:
          repository: slopus/happy
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1

      - name: Verify pinned commit and Dockerfile
        run: |
          set -eu
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          grep -q 'EXPOSE 3005' upstream/Dockerfile
          grep -q 'standalone.ts' upstream/Dockerfile
          ! grep -q 'EXPOSE 3000' upstream/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 standalone image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.UPSTREAM_REF }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.version=${{ env.UPSTREAM_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Try to make the GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/happy-arm64 \
            -f visibility=public || \
          echo "visibility change denied; pull with a short-lived token instead"

      - name: Record digest
        run: |
          docker buildx imagetools inspect "$IMAGE:$UPSTREAM_REF"
